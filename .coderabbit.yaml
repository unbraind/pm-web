# CodeRabbit review configuration.
#
# `dist/` is generated by `npm run build` and committed so consumers installing
# from git get a built package. Reviewing it is noise: every finding restates
# one already visible in the source it was compiled from, and the compiler is
# what guarantees the two agree.
#
# Excluding it is also what keeps a review possible. CodeRabbit skips any pull
# request over 100 changed files, and it reports that as "Review skipped"
# rather than as a failure — an unreviewed pull request looks exactly like a
# clean one. A tree-wide change to this package exceeds 100 files on the
# strength of `dist/` alone, so without this filter the reviews that matter
# most are the ones silently dropped.
reviews:
  path_filters:
    - "!dist/**"
