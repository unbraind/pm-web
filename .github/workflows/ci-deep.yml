name: CI Deep

on:
  push:
    branches: [main]
  schedule:
    # Off peak, separate from release (hourly :41) and CodeQL (Monday 04:47).
    - cron: "19 2 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-deep-${{ github.ref }}
  cancel-in-progress: true

jobs:
  independent:
    name: deep independent
    runs-on: ${{ vars.PM_LOCAL_DEEP != 'off' && fromJSON('["self-hosted","pm-local"]') || 'ubuntu-latest' }}
    timeout-minutes: 120
    env:
      PM_TEST_DEPTH: full
      PM_TEST_TIME_SCALE: 3
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}

      - name: Setup Bun
        if: runner.environment == 'github-hosted'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: npm ci

      - name: Install pinned managed GitHub extension
        run: bash scripts/install-pm-github.sh

      - name: Verify tracked pm project health
        shell: bash
        run: |
          set -euo pipefail
          # Catch durable checkout-visible failures: conflict markers, parse failures,
          # invalid or drifted history, tracked runtime caches, extension health,
          # stale in-progress work, and any merge evidence present in this clone.
          #
          # This is not a lossless-merge attestation. Merge receipts are clone-local and
          # absent from a fresh CI checkout. Some unreconciled loss shapes surface as
          # history drift, but reconciliation or history repair can remove that signal.
          # Keep receipt review as a local pre-push step; pm-cli#921 and pm-cli#922 track
          # the missing durable proof.
          #
          # `--strict-exit` is load-bearing: non-strict health may report findings while
          # still exiting successfully. `--require-merge-drivers` fails the job when
          # this checkout never registered the drivers `.gitattributes` declares; npm
          # ci's `prepare` hook already installed them, so a miss means the hook broke.
          ./node_modules/.bin/pm health --strict-exit --require-merge-drivers


      - name: Record Bun version
        run: bun --version

      - name: Independent static gates
        run: |
          npm run check
          npm run lint
          npm run duplication
          npm run docstring

      - name: Build and verify committed output is current
        shell: bash
        run: |
          set -euo pipefail
          # Every flag below is load-bearing. Do not simplify any of them without
          # reading why it is here; each one was a way this gate silently passed.
          #
          #   'dist/' with the trailing slash — cosmetic, not corrective. A bare
          #     `dist` pathspec does NOT match dist-test/; git pathspecs match whole
          #     path components, so `dist` matches the dist directory and nothing
          #     else. An earlier revision of this comment claimed otherwise and was
          #     wrong (caught in review on pm-web#76). The slash is kept only
          #     because it states the intent at a glance.
          #   --error-unmatch + exit 1 — an untracked dist/ used to skip the gate.
          #     This package is installed by copying the repository, so untracked
          #     build output is the defect, not an exemption from checking for it.
          #   rm -rf dist — tsc never removes output for a deleted source, so an
          #     orphaned artifact survived every rebuild and every comparison.
          #   git status, not git diff — `git diff --quiet` cannot see a NEW file at
          #     all, so a newly generated artifact was invisible to it.
          #   --untracked-files=all — without it a new file inside a tracked
          #     directory is reported as the directory, not the file.
          #   --ignored=matching — some packages gitignore a dist/ whose contents
          #     git tracks; there a new artifact is invisible to plain git status
          #     too, so one .gitignore line would have disabled this gate forever.
          #     'matching' rather than plain --ignored keeps the report scoped to the
          #     pathspec instead of listing node_modules.
          if ! git ls-files --error-unmatch 'dist/' > /dev/null 2>&1; then
            echo "::error::dist/ is not tracked. This package is installed by copying the repository, so the build output has to be in git."
            exit 1
          fi
          rm -rf dist
          npm run build
          drift=$(git status --porcelain=v1 --untracked-files=all --ignored=matching -- 'dist/')
          if [ -n "$drift" ]; then
            echo "::error::Committed dist/ does not match a fresh build. Run 'npm run build' and commit the result."
            printf '%s\n' "$drift"
            exit 1
          fi
          echo "Committed dist/ matches a fresh build."


      - name: Full independent seeded and documentation contracts
        run: node --test --test-concurrency=2 test/ci-tiers.test.ts test/contract-explorer.test.ts test/evidence-inspection.test.ts test/permission-impact.test.ts test/identity-audit.test.ts test/replay-privacy.test.ts test/signing-secret-fixture.test.ts test/evidence-source-security.test.ts test/startup-docs.test.ts test/graph-layout-docs.test.ts test/capacity-trace.test.ts test/gated-sync-verification.test.ts test/audit-development-receipt.test.ts test/packaging.test.ts test/package-metadata.test.ts test/published-document-links.test.ts

  deep:
    # Explicit service exception: each job runs exactly ONE intact release gate.
    # PostgreSQL service containers require the hosted Docker socket.
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 26]
        package-manager: [npm, bun]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: pmwebtest
        ports:
          - 55433:5432
        # Without the health check the first step can connect before Postgres is
        # accepting connections; the initdb bootstrap takes a second or two.
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      PM_TEST_DEPTH: full
      PM_TEST_TIME_SCALE: 3
      # Matches the default in scripts/with-test-db.ts, which is also what the
      # local `npm run db:up` container listens on, so local and CI runs agree.
      DATABASE_URL: postgres://postgres:test@127.0.0.1:55433/pmwebtest
      JWT_SECRET: pm-web-test-jwt-secret-at-least-32-bytes

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}

      - name: Setup Bun
        if: runner.environment == 'github-hosted'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: npm ci

      - name: Install pinned managed GitHub extension
        run: bash scripts/install-pm-github.sh

      - name: Verify tracked pm project health
        shell: bash
        run: |
          set -euo pipefail
          # Catch durable checkout-visible failures: conflict markers, parse failures,
          # invalid or drifted history, tracked runtime caches, extension health,
          # stale in-progress work, and any merge evidence present in this clone.
          #
          # This is not a lossless-merge attestation. Merge receipts are clone-local and
          # absent from a fresh CI checkout. Some unreconciled loss shapes surface as
          # history drift, but reconciliation or history repair can remove that signal.
          # Keep receipt review as a local pre-push step; pm-cli#921 and pm-cli#922 track
          # the missing durable proof.
          #
          # `--strict-exit` is load-bearing: non-strict health may report findings while
          # still exiting successfully. `--require-merge-drivers` fails the job when
          # this checkout never registered the drivers `.gitattributes` declares; npm
          # ci's `prepare` hook already installed them, so a miss means the hook broke.
          ./node_modules/.bin/pm health --strict-exit --require-merge-drivers


      - name: Record Bun version
        run: bun --version

      # Literal launchers let the unchanged publish-attestation verifier prove
      # executable identity. Exactly one condition matches each matrix job.
      - name: Full npm release gate with isolated Git identity
        if: matrix.package-manager == 'npm'
        run: env HOME="$(mktemp -d)" GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 npm run release:check

      - name: Full Bun release gate with isolated Git identity
        if: matrix.package-manager == 'bun'
        run: env HOME="$(mktemp -d)" GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 bun run release:check

      - name: Bun and bunx package graph smoke
        run: |
          bun install --no-save
          bunx --no-install pm --version

  browsers:
    name: deep browsers
    # Playwright --with-deps needs apt; these jobs also need PostgreSQL services.
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: pmwebtest
        ports:
          - 55433:5432
        # Without the health check the first step can connect before Postgres is
        # accepting connections; the initdb bootstrap takes a second or two.
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      PM_TEST_DEPTH: full
      PM_TEST_TIME_SCALE: 3
      # Matches the default in scripts/with-test-db.ts, which is also what the
      # local `npm run db:up` container listens on, so local and CI runs agree.
      DATABASE_URL: postgres://postgres:test@127.0.0.1:55433/pmwebtest
      JWT_SECRET: pm-web-test-jwt-secret-at-least-32-bytes

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}

      - name: Setup Bun
        if: runner.environment == 'github-hosted'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: npm ci

      - name: Build browser baseline
        run: npm run build

      - name: Install browser for decision inbox evidence
        run: node node_modules/playwright-core/cli.js install --with-deps chromium

      - name: Verify common maker footer placement, viewport and stylesheet cache keys
        run: node --test --test-concurrency=2 test/maker-footer-browser.acceptance.ts

      - name: Capture seeded decision inbox before and after
        env:
          INBOX_SCREENSHOTS: ${{ runner.temp }}/decision-inbox-screenshots
          # Exercise the checked-out tree for both pushes and PR merge commits.
          INBOX_BASE_REF: ${{ github.sha }}
        run: node scripts/with-test-db.ts node scripts/decision-inbox-browser.ts

      - name: Attach decision inbox screenshots
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: decision-inbox-screenshots
          path: ${{ runner.temp }}/decision-inbox-screenshots
          if-no-files-found: error
          retention-days: 30

      - name: Verify authorized agent context views
        env:
          CONTEXT_SCREENSHOTS: ${{ runner.temp }}/agent-context-screenshots
        run: |
          node scripts/with-test-db.ts node --test --test-concurrency=2 test/agent-context-browser.acceptance.ts
          node scripts/with-test-db.ts node scripts/agent-context-browser.ts

      - name: Attach agent context screenshots
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-context-screenshots
          path: ${{ runner.temp }}/agent-context-screenshots
          if-no-files-found: error
          retention-days: 30

      - name: Verify backend contract explorer in desktop and mobile browsers
        env:
          CONTRACT_SCREENSHOTS: ${{ runner.temp }}/contract-explorer-screenshots
        run: node scripts/with-test-db.ts node --test test/contract-explorer-browser.acceptance.ts

      - name: Attach backend contract explorer screenshots
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: contract-explorer-screenshots
          path: ${{ runner.temp }}/contract-explorer-screenshots
          if-no-files-found: error
          retention-days: 30

      - name: Verify permission impact preview and access invalidation in browsers
        run: node scripts/with-test-db.ts node scripts/permission-impact-browser.ts
